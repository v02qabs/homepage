    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory & File Index</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.5; }
        h1 { color: #333; }
        #search { width: 100%; max-width: 500px; padding: 10px; margin-bottom: 20px; font-size: 16px; box-sizing: border-box; }
        ul { list-style-type: none; padding-left: 0; }
        li { margin: 5px 0; }
        a { text-decoration: none; color: #0066cc; }
        a:hover { text-decoration: underline; }
        .dir { font-weight: bold; color: #2a6496; }
        .file { color: #333; }
    </style>
</head>
<body>
    <h1>ファイル・ディレクトリ一覧</h1>
    <input type="text" id="search" placeholder="検索キーワードを入力..." onkeyup="filterList()">
    
    <ul id="file-list">
    </ul>

    <script>
        function filterList() {
            var input = document.getElementById('search');
            var filter = input.value.toLowerCase();
            var ul = document.getElementById("file-list");
            var li = ul.getElementsByTagName('li');

            for (var i = 0; i < li.length; i++) {
                var a = li[i].getElementsByTagName("a")[0];
                var txtValue = a.textContent || a.innerText;
                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                    li[i].style.display = "";
                } else {
                    li[i].style.display = "none";
                }
            }
        }
