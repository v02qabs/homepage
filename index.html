<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
        /* 全体のリセットと基本設定 */
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f4f9;
        }

        /* メニューのスタイル（CSS） */
        .menu {
            display: flex; /* 横並び */
            list-style: none;
            margin: 0;
            padding: 0;
            background-color: #333; /* 背景色：ダークグレー */
            overflow-x: auto; /* 画面が狭い場合の横スクロール対応 */
        }

        .menu li {
            flex: 1; /* 各項目を均等な幅にする */
            min-width: 90px;
        }

        .menu a {
            display: block;
            text-align: center;
            padding: 16px 10px;
            color: white;
            text-decoration: none;
            transition: background-color 0.3s;
            white-space: nowrap; /* テキストの改行を防ぐ */
        }

        /* マウスオーバー時（ホバー）の動き */
        .menu a:hover {
            background-color: #555;
        }

        /* アクティブなメニューの色 */
        .menu a.active {
            background-color: #4CAF50; /* グリーン */
        }
    </style>
</head>
<body>

    <ul class="menu" id="nav-menu">
        <li><a href="index.html" class="active">トップページ</a></li>
        <li><a href="#">AndroidApp</a></li>
        <li><a href="#">Clang</a></li>
        <li><a href="#">Java</a></li>
        <li><a href="#">python</a></li>
        <li><a href="#">windows</a></li>
        <li><a href="Linux.html">Linux</a></li>
        <li><a href="#">Chrome Book cm3</a></li>
    </ul>

    <script>
        // JS処理（必要に応じてページ移動などの処理を追加可能）
    </script>
</body>
</html>
